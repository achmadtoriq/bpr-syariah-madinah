name: Build & Auto-Commit Vendor & Assets

on:
  push:
    branches: [ feature/deployment-workflow ]

jobs:
  build-and-commit:
    name: Build Composer & CSS Assets on GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, curl, json, gd, xml, zip, imap
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

      - name: Install Node Dependencies & Build CSS
        run: |
          npm ci || npm install
          npm run build:css

      - name: Commit & Push Compiled Vendor & Assets if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: compile vendor dependencies and tailwind css via github actions [skip ci]"
          file_pattern: "vendor/ public/assets/css/style.css"
          branch: ${{ github.ref_name }}
